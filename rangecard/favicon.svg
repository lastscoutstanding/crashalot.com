<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Range Card" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Deliberately sparse. A real reticle has a ladder of marks; at 16 px that
       collapses into a smudge, so this keeps the ring, the crosshair and one
       holdover mark and drops everything else. Arms run past the ring and the
       centre stays open, which is what keeps the shape readable when small. -->
  <rect width="32" height="32" rx="7" fill="#14160F"/>
  <circle cx="16" cy="16" r="10.6" fill="none" stroke="#8B9663" stroke-width="1.1"/>
  <g stroke="#E2A32B" stroke-width="2" stroke-linecap="round">
    <path d="M16 2.2v9.4"/>
    <path d="M16 20.4v9.4"/>
    <path d="M2.2 16h9.4"/>
    <path d="M20.4 16h9.4"/>
    <path d="M13.8 22.1h4.4"/>
  </g>
  <circle cx="16" cy="16" r="1.5" fill="#E2A32B"/>
</svg>
