<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrashALot | Projecten</title>
    <meta name="description" content="Een verzameling projecten: webapps, tools en experimenten.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23111'/><text x='50' y='68' font-family='Arial' font-weight='700' font-size='52' fill='%23ff6a33' text-anchor='middle'>C</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           Tokens
           ========================================================= */
        :root {
            --zwart: #000;
            --wit: #fff;
            --tekst-donker: #141414;
            --gedempt: #9a9a9a;

            /* Tegelkleuren */
            --grijs: #cfcfcf;
            --gebroken-wit: #efefef;
            --geel: #e8d84f;
            --cyaan: #4fd8f2;
            --oranje: #ff6a33;
            --paars: #b57bf2;

            --serif: "Newsreader", "Iowan Old Style", Georgia, "Times New Roman", serif;
            --sans: "Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;

            --rand: clamp(16px, 3vw, 32px);
            --tussenruimte: clamp(12px, 1.6vw, 20px);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body { margin: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--zwart);
            color: var(--wit);
            font-family: var(--sans);
            font-size: 1rem;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; }

        :focus-visible {
            outline: 2px solid var(--wit);
            outline-offset: 3px;
        }

        /* =========================================================
           Kop
           ========================================================= */
        .kop {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px 32px;
            padding: clamp(20px, 3vw, 32px) var(--rand);
            max-width: 1320px;
            width: 100%;
            margin: 0 auto;
        }

        .merk {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }

        .woordmerk {
            font-family: var(--sans);
            font-weight: 700;
            font-size: clamp(1.9rem, 4vw, 2.6rem);
            line-height: 1;
            letter-spacing: -0.04em;
        }

        .ondertitel {
            font-family: var(--serif);
            font-size: 0.66rem;
            line-height: 1.25;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--wit);
        }

        .navigatie ul {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 28px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .navigatie a {
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            color: var(--wit);
            padding: 4px 0;
            background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat;
            transition: background-size 0.25s ease;
        }
        .navigatie a:hover { background-size: 100% 1px; }

        /* =========================================================
           Tegelraster
           ========================================================= */
        main {
            flex: 1;
            width: 100%;
            max-width: 1320px;
            margin: 0 auto;
            padding: clamp(8px, 2vw, 24px) var(--rand) clamp(40px, 6vw, 72px);
        }

        .raster {
            display: flex;
            gap: var(--tussenruimte);
            align-items: flex-start;
        }

        .kolom {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: var(--tussenruimte);
        }

        /* Verspringende kolommen, zoals in een collectie-overzicht */
        .kolom:nth-child(2) { margin-top: clamp(40px, 6vw, 88px); }
        .kolom:nth-child(3) { margin-top: clamp(16px, 2.5vw, 32px); }

        .tegel {
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 220px;
            padding: clamp(18px, 2vw, 24px) clamp(18px, 2vw, 24px) 0;
            background: var(--kleur, var(--grijs));
            color: var(--tekst-donker);
            border-radius: 2px;
            transition: filter 0.2s ease;
        }
        .tegel.hoog { min-height: 320px; }

        .tegel-titel {
            font-family: var(--serif);
            font-weight: 400;
            font-size: clamp(1.7rem, 2.6vw, 2.15rem);
            line-height: 1.05;
            letter-spacing: -0.01em;
            margin: 0;
            max-width: 12ch;
        }

        .tegel-tekst {
            font-size: 0.95rem;
            line-height: 1.5;
            margin: 14px 0 20px;
            max-width: 34ch;
            opacity: 0.8;
        }

        .tegel-voet {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: auto;
            margin-left: calc(clamp(18px, 2vw, 24px) * -1);
            margin-right: calc(clamp(18px, 2vw, 24px) * -1);
            padding: 14px clamp(18px, 2vw, 24px);
            border-top: 1px solid rgba(0, 0, 0, 0.14);
            font-size: 0.82rem;
            font-weight: 500;
        }

        .rondje {
            flex: none;
            display: grid;
            place-items: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--tekst-donker);
            color: var(--kleur, var(--grijs));
            font-size: 0.72rem;
            font-weight: 700;
        }

        .label-rechts {
            margin-left: auto;
            opacity: 0.6;
            white-space: nowrap;
        }

        /* Hele tegel klikbaar via de titel-link */
        .tegel a {
            text-decoration: none;
        }
        .tegel a::after {
            content: "";
            position: absolute;
            inset: 0;
        }
        .tegel:has(a:hover) { filter: brightness(1.06); }
        .tegel:has(a:hover) .tegel-titel {
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 5px;
        }
        .tegel a:focus-visible { outline: none; }
        .tegel:has(a:focus-visible) { outline: 2px solid var(--wit); outline-offset: 4px; }

        .tegel.stil { background: transparent; color: var(--gedempt); border: 1px dashed #3a3a3a; }
        .tegel.stil .tegel-voet { border-top-color: #2a2a2a; }
        .tegel.stil .rondje { background: #2a2a2a; color: var(--gedempt); }

        /* =========================================================
           Voet
           ========================================================= */
        .voet {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 24px;
            max-width: 1320px;
            width: 100%;
            margin: 0 auto;
            padding: 24px var(--rand) 32px;
            border-top: 1px solid #222;
            color: var(--gedempt);
            font-size: 0.85rem;
        }
        .voet a { color: var(--wit); text-underline-offset: 3px; }

        /* =========================================================
           Responsief
           ========================================================= */
        @media (max-width: 560px) {
            .kolom:nth-child(n) { margin-top: 0; }
            .tegel, .tegel.hoog { min-height: 0; }
            .tegel-titel { max-width: none; }
            .navigatie ul { gap: 6px 20px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>

    <header class="kop">
        <a class="merk" href="./" aria-label="CrashALot, naar de homepage">
            <span class="woordmerk">CRASHALOT</span>
            <span class="ondertitel" aria-hidden="true">Webapps<br>tools en<br>experimenten</span>
        </a>
        <nav class="navigatie" aria-label="Projecten">
            <ul id="navigatie"></ul>
        </nav>
    </header>

    <main>
        <h1 class="visueel-verborgen" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Projecten van CrashALot</h1>
        <div class="raster" id="raster"></div>

        <noscript>
            <ul>
                <li><a href="https://wijnkelder.eu">Wijnkelder</a></li>
                <li><a href="https://watchcafe.eu">Sioux Watch Café</a></li>
                <li><a href="rangecard/">Range Card</a></li>
                <li><a href="hoofdkwartier/">Het hoofdkwartier (archief)</a></li>
                <li><a href="guust/">M'enfin! Crash-a-lot (archief)</a></li>
            </ul>
        </noscript>
    </main>

    <footer class="voet">
        <span>&copy; <span id="jaar">2026</span> CrashALot</span>
        <span>Eerdere versies: <a href="hoofdkwartier/">Het hoofdkwartier</a> en <a href="guust/">M'enfin!</a></span>
    </footer>

    <script>
    (() => {
        /* =========================================================
           PROJECTEN — hier voeg je tegels toe of pas je ze aan.
           kleur: grijs, gebroken-wit, geel, cyaan, oranje, paars
           hoog: true maakt de tegel hoger
           nav:  true zet het project ook bovenin de navigatie
           Zonder url wordt het een stille tegel (niet klikbaar).
           ========================================================= */
        const PROJECTEN = [
            {
                titel: "Wijnkelder",
                tekst: "Voorraadbeheer voor een wijnkelder, met zoeken en automatisch opgezochte wijninformatie.",
                url: "https://wijnkelder.eu",
                label: "wijnkelder.eu",
                status: "Live",
                kleur: "paars",
                hoog: true,
                nav: true
            },
            {
                titel: "Sioux Watch Café",
                tekst: "Website van de maandelijkse horlogemeetup, met tools om de nauwkeurigheid van je horloge te meten.",
                url: "https://watchcafe.eu",
                label: "watchcafe.eu",
                status: "Live",
                kleur: "oranje",
                nav: true,
                navTitel: "Watch Café"
            },
            {
                titel: "Range Card",
                tekst: "Ballistiekcalculator voor luchtdruk: kogelbaan, correctie per afstand en een kaart voor op de baan.",
                url: "rangecard/",
                label: "crashalot.com/rangecard",
                status: "Live",
                kleur: "geel",
                hoog: true,
                nav: true
            },
      /*      {
                titel: "Het hoofdkwartier",
                tekst: "Vorige homepage: een geheime briefingruimte met onzichtbare inkt.",
                url: "hoofdkwartier/",
                label: "Archief",
                kleur: "grijs"
            },
            {
                titel: "M'enfin! Crash-a-lot",
                tekst: "De allereerste homepage, in stripstijl.",
                url: "guust/",
                label: "Archief",
                kleur: "gebroken-wit",
                hoog: true
            }, */
            {
                titel: "Volgend project",
                tekst: "In ontwikkeling.",
                label: "Binnenkort"
            }
        ];

        const $ = (s) => document.querySelector(s);
        const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        $("#jaar").textContent = new Date().getFullYear();

        /* Navigatie */
        $("#navigatie").innerHTML = PROJECTEN
            .filter((p) => p.nav && p.url)
            .map((p) => `<li><a href="${esc(p.url)}">${esc(p.navTitel || p.titel)}</a></li>`)
            .join("");

        /* Tegels */
        function maakTegel(p) {
            const art = document.createElement("article");
            art.className = "tegel" + (p.hoog ? " hoog" : "") + (p.url ? "" : " stil");
            if (p.url && p.kleur) art.style.setProperty("--kleur", `var(--${p.kleur})`);

            const titel = p.url
                ? `<a href="${esc(p.url)}">${esc(p.titel)}</a>`
                : esc(p.titel);

            art.innerHTML = `
                <h2 class="tegel-titel">${titel}</h2>
                ${p.tekst ? `<p class="tegel-tekst">${esc(p.tekst)}</p>` : ""}
                <div class="tegel-voet">
                    <span class="rondje" aria-hidden="true">${esc(p.titel.replace(/[^A-Za-zÀ-ÿ]/g, "").charAt(0).toUpperCase())}</span>
                    <span>${esc(p.label)}</span>
                    ${p.status ? `<span class="label-rechts">${esc(p.status)}</span>` : ""}
                </div>`;
            return art;
        }

        const raster = $("#raster");
        const tegels = PROJECTEN.map(maakTegel);

        function aantalKolommen() {
            const b = window.innerWidth;
            if (b <= 560) return 1;
            if (b <= 900) return 2;
            return 3;
        }

        let huidig = 0;
        function verdeel() {
            const n = aantalKolommen();
            if (n === huidig) return;
            huidig = n;
            raster.innerHTML = "";
            const kolommen = Array.from({ length: n }, () => {
                const k = document.createElement("div");
                k.className = "kolom";
                raster.appendChild(k);
                return k;
            });
            /* Van links naar rechts vullen, rij voor rij: leesvolgorde blijft logisch */
            tegels.forEach((t, i) => kolommen[i % n].appendChild(t));
        }

        verdeel();
        window.addEventListener("resize", verdeel);
    })();
    </script>

</body>
</html>
